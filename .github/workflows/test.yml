name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install missing tools
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            [ "$(bash -c 'echo ${BASH_VERSINFO[0]}')" -ge 5 ] || brew install bash
            command -v gpg >/dev/null || brew install gnupg
            command -v shellcheck >/dev/null || brew install shellcheck
          else
            command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          fi
          bash --version | head -n 1
          gpg --version | head -n 1
          shellcheck --version | sed -n 2p

      - name: shellcheck
        run: shellcheck -S style -x setup-git-hosts.sh tests/*.sh

      - name: Scenario tests
        run: bash tests/run.sh
